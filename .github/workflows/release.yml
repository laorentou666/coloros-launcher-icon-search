name: Release APKs

on:
  push:
    branches:
      - v1.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "releases/图标资源名搜索_全量资源搜索_API101.apk" \
            "releases/图标资源名搜索_全量资源搜索_API102.apk" \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "v1.0.0" \
            --notes "首个公开版本，包含 libxposed API 101 与 API 102 APK。"
