name: Release APKs

on:
  push:
    branches:
      - v1.0.0

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Upload APKs to the existing release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            "releases/coloros-icon-search-api101.apk" \
            "releases/coloros-icon-search-api102.apk" \
            --repo "${GITHUB_REPOSITORY}" \
            --clobber
